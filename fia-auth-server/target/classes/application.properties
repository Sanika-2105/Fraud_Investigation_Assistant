spring.application.name=fia-auth-server

server.port=8083
# Database
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# JWT
security.jwt.secret=my-super-secret-key-my-super-secret-key-12345
security.jwt.expiry=3600000

# Actuator / Info
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

info.app.name=FIA Auth Server
info.app.description=Fraud Investigation Assistant Authentication Service
info.app.version=1.0.0