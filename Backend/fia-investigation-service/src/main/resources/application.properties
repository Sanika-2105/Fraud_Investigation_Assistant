spring.application.name=fia-investigation-service
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/investigation_db
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Configuration
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Application Information
info.app.name=fia-investigation-service
info.app.description=Fraud Investigation Assistant - Investigation Service
info.app.version=1.0.1

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.shutdown.access=unrestricted
management.info.env.enabled=true
management.endpoint.health.show-details=always


