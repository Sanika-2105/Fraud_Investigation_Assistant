spring.application.name=fia-gateway-server

server.port=9090

info.app.name= Gateway Server
info.app.description= Fraud Investigation Assistant Gateway Server Application
info.app.version= 1.0.0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.info.env.enabled= true

spring.cloud.gateway.discovery.locator.enabled=true

spring.cloud.gateway.discovery.locator.lower-case-service-id=true

management.endpoint.gateway.access=unrestricted

security.jwt.secret=my-super-secret-key-my-super-secret-key-12345
security.jwt.expiry=3600000